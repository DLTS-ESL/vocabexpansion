<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short Vowels Vocabulary</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #eaf6ff;
        color: #18324a;
    }

    .app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 25px 18px 45px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        text-align: center;
        margin-bottom: 18px;
    }

    .header h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 52px);
        font-weight: 800;
        color: #1769aa;
        letter-spacing: 1px;
    }

    .header p {
        margin: 8px auto 0;
        max-width: 720px;
        font-size: 18px;
        line-height: 1.5;
        color: #4c687d;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .navigation {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 20px 0 12px;
        flex-wrap: wrap;
    }

    .nav-left,
    .nav-right {
        display: flex;
        gap: 10px;
    }

    .nav-button {
        border: none;
        border-radius: 14px;
        padding: 13px 20px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
        min-height: 48px;
    }

    .back-button {
        background: #ffffff;
        color: #1769aa;
        border: 2px solid #b8ddf5;
    }

    .reset-button {
        background: #1769aa;
        color: white;
    }

    .nav-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 14px rgba(40, 100, 150, 0.15);
    }

    .nav-button:active {
        transform: translateY(0);
    }

    .nav-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    /* =========================
       BREADCRUMB
    ========================= */

    .breadcrumb {
        background: rgba(255,255,255,0.75);
        border: 1px solid #c8e5f7;
        border-radius: 14px;
        padding: 13px 17px;
        margin-bottom: 18px;
        font-size: 16px;
        color: #527188;
        overflow-x: auto;
        white-space: nowrap;
    }

    .breadcrumb span {
        font-weight: 700;
        color: #1769aa;
    }

    .breadcrumb .separator {
        color: #9ab7ca;
        padding: 0 7px;
    }

    /* =========================
       INSTRUCTION
    ========================= */

    .instruction {
        background: white;
        border-radius: 18px;
        padding: 18px 20px;
        margin-bottom: 22px;
        border-left: 6px solid #58aee5;
        box-shadow: 0 5px 18px rgba(60, 120, 160, 0.08);
    }

    .instruction-title {
        font-size: 20px;
        font-weight: 800;
        color: #1769aa;
        margin-bottom: 5px;
    }

    .instruction-text {
        font-size: 16px;
        line-height: 1.5;
        color: #5b7180;
    }

    /* =========================
       SECTION TITLE
    ========================= */

    .section-heading {
        text-align: center;
        margin: 15px 0 20px;
    }

    .section-heading h2 {
        margin: 0;
        font-size: clamp(25px, 5vw, 36px);
        color: #214f70;
    }

    .section-heading p {
        margin: 7px 0 0;
        color: #668194;
        font-size: 17px;
    }

    /* =========================
       CARDS
    ========================= */

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
    }

    .card {
        border: none;
        width: 100%;
        min-height: 105px;
        background: white;
        border-radius: 20px;
        padding: 20px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(60, 120, 160, 0.10);
        border: 2px solid transparent;
        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            border-color 0.2s ease,
            background 0.2s ease;
        text-align: center;
        color: #173b55;
    }

    .card:hover {
        transform: translateY(-4px);
        border-color: #83c8ee;
        box-shadow: 0 10px 23px rgba(50, 120, 170, 0.18);
        background: #fafdff;
    }

    .card:active {
        transform: scale(0.98);
    }

    .card:focus-visible {
        outline: 4px solid #9bd8f5;
        outline-offset: 3px;
    }

    .card-symbol {
        font-size: 15px;
        font-weight: 700;
        color: #71a5c3;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .card-word {
        font-size: clamp(24px, 4vw, 32px);
        font-weight: 800;
        line-height: 1.2;
    }

    .card-description {
        margin-top: 9px;
        font-size: 15px;
        color: #708697;
    }

    /* =========================
       VOWEL CARDS
    ========================= */

    .vowel-card {
        min-height: 155px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .vowel-letter {
        font-size: 58px;
        font-weight: 900;
        line-height: 1;
        color: #1769aa;
        margin-bottom: 10px;
    }

    .vowel-name {
        font-size: 21px;
        font-weight: 800;
        color: #345d76;
    }

    /* =========================
       SOUND CARDS
    ========================= */

    .sound-card {
        min-height: 130px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .sound-pattern {
        font-size: clamp(30px, 6vw, 42px);
        font-weight: 900;
        color: #1769aa;
    }

    .sound-example {
        margin-top: 8px;
        font-size: 16px;
        color: #6c8292;
    }

    /* =========================
       WORD CARDS
    ========================= */

    .word-card {
        min-height: 125px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .word-main {
        font-size: clamp(27px, 5vw, 38px);
        font-weight: 800;
        color: #214f70;
    }

    .word-pattern {
        margin-top: 7px;
        font-size: 15px;
        font-weight: 700;
        color: #7a9aad;
    }

    /* =========================
       EXPANSION CARDS
    ========================= */

    .expansion-card {
        min-height: 135px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .expansion-word {
        font-size: clamp(24px, 4.5vw, 34px);
        font-weight: 800;
        color: #214f70;
    }

    .expansion-note {
        margin-top: 8px;
        font-size: 14px;
        color: #76909f;
    }

    /* =========================
       WORD DETAIL
    ========================= */

    .word-detail {
        background: white;
        border-radius: 24px;
        padding: 30px 25px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(60, 120, 160, 0.10);
        margin-bottom: 20px;
    }

    .detail-label {
        color: #77a3ba;
        font-size: 15px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .detail-word {
        font-size: clamp(42px, 9vw, 72px);
        font-weight: 900;
        color: #1769aa;
        margin: 5px 0 15px;
    }

    .detail-message {
        font-size: 18px;
        line-height: 1.5;
        color: #587184;
        max-width: 700px;
        margin: 0 auto;
    }

    /* =========================
       EMPTY / END
    ========================= */

    .end-message {
        background: white;
        border-radius: 20px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 5px 18px rgba(60,120,160,0.08);
    }

    .end-message h3 {
        margin: 0 0 8px;
        color: #1769aa;
        font-size: 27px;
    }

    .end-message p {
        margin: 0;
        color: #668194;
        font-size: 17px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
        text-align: center;
        margin-top: 35px;
        color: #7b96a7;
        font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        .app {
            padding: 18px 12px 35px;
        }

        .header p {
            font-size: 16px;
        }

        .navigation {
            flex-direction: column;
            align-items: stretch;
        }

        .nav-left,
        .nav-right {
            width: 100%;
        }

        .nav-button {
            flex: 1;
        }

        .cards {
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card {
            min-height: 100px;
        }

        .vowel-card {
            min-height: 135px;
        }

        .instruction {
            padding: 15px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <h1>SHORT VOWELS</h1>
        <p>
            Start with the sound, read the word, and explore more vocabulary.
        </p>
    </div>

    <!-- NAVIGATION -->
    <div class="navigation">

        <div class="nav-left">
            <button
                id="backButton"
                class="nav-button back-button"
                onclick="goBack()">
                ← Back
            </button>
        </div>

        <div class="nav-right">
            <button
                class="nav-button reset-button"
                onclick="resetApp()">
                ↺ Reset
            </button>
        </div>

    </div>

    <!-- BREADCRUMB -->
    <div id="breadcrumb" class="breadcrumb"></div>

    <!-- MAIN CONTENT -->
    <div id="content"></div>

    <div class="footer">
        Short Vowels Vocabulary Explorer
    </div>

</div>


<script>

};


/* =========================================================
   APP STATE
========================================================= */

let currentView = {
    level: "root",
    vowel: null,
    sound: null,
    word: null,
    selectedExpansion: null
};

let historyStack = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content = document.getElementById("content");
const breadcrumb = document.getElementById("breadcrumb");
const backButton = document.getElementById("backButton");


/* =========================================================
   SAVE STATE
========================================================= */

function saveState() {

    historyStack.push(JSON.stringify(currentView));

}


/* =========================================================
   RESTORE STATE
========================================================= */

function restoreState() {

    if (historyStack.length === 0) {
        return;
    }

    currentView = JSON.parse(historyStack.pop());

    render();

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

    if (historyStack.length > 0) {
        restoreState();
    }

}


/* =========================================================
   RESET
========================================================= */

function resetApp() {

    historyStack = [];

    currentView = {
        level: "root",
        vowel: null,
        sound: null,
        word: null,
        selectedExpansion: null
    };

    render();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   SELECT VOWEL
========================================================= */

function selectVowel(vowel) {

    saveState();

    currentView = {
        level: "sounds",
        vowel: vowel,
        sound: null,
        word: null,
        selectedExpansion: null
    };

    render();

}


/* =========================================================
   SELECT SOUND
========================================================= */

function selectSound(sound) {

    saveState();

    currentView = {
        level: "words",
        vowel: currentView.vowel,
        sound: sound,
        word: null,
        selectedExpansion: null
    };

    render();

}


/* =========================================================
   SELECT WORD
========================================================= */

function selectWord(word) {

    saveState();

    currentView = {
        level: "expansion",
        vowel: currentView.vowel,
        sound: currentView.sound,
        word: word,
        selectedExpansion: null
    };

    render();

}


/* =========================================================
   SELECT EXPANSION
========================================================= */

function selectExpansion(word) {

    saveState();

    currentView = {
        level: "detail",
        vowel: currentView.vowel,
        sound: currentView.sound,
        word: currentView.word,
        selectedExpansion: word
    };

    render();

}


/* =========================================================
   ROOT
========================================================= */

function renderRoot() {

    breadcrumb.innerHTML = `
        <span>Short Vowels</span>
    `;

    content.innerHTML = `

        <div class="instruction">

            <div class="instruction-title">
                Let's build our vocabulary!
            </div>

            <div class="instruction-text">
                Choose a short vowel. Then choose a sound pattern,
                read the core words, and explore more words.
                Knowing the sound pattern can help you read and write
                many new words.
            </div>

        </div>


        <div class="section-heading">

            <h2>Choose a Short Vowel</h2>

            <p>
                Click A, E, I, O, or U to begin.
            </p>

        </div>


        <div class="cards">

            ${createVowelCard("A")}
            ${createVowelCard("E")}
            ${createVowelCard("I")}
            ${createVowelCard("O")}
            ${createVowelCard("U")}

        </div>
    `;

}


/* =========================================================
   VOWEL CARD
========================================================= */

function createVowelCard(vowel) {

    const item = vocabulary[vowel];

    return `
        <button
            class="card vowel-card"
            onclick="selectVowel('${vowel}')">

            <div class="vowel-letter">
                ${vowel}
            </div>

            <div class="vowel-name">
                ${item.name}
            </div>

        </button>
    `;

}


/* =========================================================
   SOUND VIEW
========================================================= */

function renderSounds() {

    const vowel = vocabulary[currentView.vowel];

    breadcrumb.innerHTML = `
        <span>Short Vowels</span>
        <span class="separator">›</span>
        <span>${vowel.name}</span>
    `;

    const soundEntries = Object.entries(vowel.sounds);

    content.innerHTML = `

        <div class="instruction">

            <div class="instruction-title">
                Short Vowel ${currentView.vowel}
            </div>

            <div class="instruction-text">
                Choose a sound pattern. Each pattern contains words
                that use the same short vowel sound.
            </div>

        </div>


        <div class="section-heading">

            <h2>Choose a Sound</h2>

            <p>
                Click a pattern to see its core words.
            </p>

        </div>


        <div class="cards">

            ${soundEntries.map(([sound, data]) => {

                const firstWords = Object.keys(data.words)
                    .slice(0, 3)
                    .join(", ");

                return `
                    <button
                        class="card sound-card"
                        onclick="selectSound('${sound}')">

                        <div class="sound-pattern">
                            ${sound}
                        </div>

                        <div class="sound-example">
                            ${firstWords}...
                        </div>

                    </button>
                `;

            }).join("")}

        </div>
    `;

}


/* =========================================================
   WORD VIEW
========================================================= */

function renderWords() {

    const vowel = vocabulary[currentView.vowel];
    const soundData = vowel.sounds[currentView.sound];

    const words = Object.keys(soundData.words);

    breadcrumb.innerHTML = `
        <span>Short Vowels</span>
        <span class="separator">›</span>
        <span>${vowel.name}</span>
        <span class="separator">›</span>
        <span>${currentView.sound}</span>
    `;

    content.innerHTML = `

        <div class="instruction">

            <div class="instruction-title">
                Sound Pattern: ${currentView.sound}
            </div>

            <div class="instruction-text">
                These are core words you can read using this sound pattern.
                Click a word to explore more vocabulary.
            </div>

        </div>


        <div class="section-heading">

            <h2>Core Words</h2>

            <p>
                Click a word to build more vocabulary.
            </p>

        </div>


        <div class="cards">

            ${words.map(word => `

                <button
                    class="card word-card"
                    onclick="selectWord('${word}')">

                    <div class="word-main">
                        ${word}
                    </div>

                    <div class="word-pattern">
                        ${currentView.sound}
                    </div>

                </button>

            `).join("")}

        </div>
    `;

}


/* =========================================================
   EXPANSION VIEW
========================================================= */

function renderExpansion() {

    const vowel = vocabulary[currentView.vowel];
    const soundData = vowel.sounds[currentView.sound];

    const expansions = soundData.words[currentView.word] || [];

    breadcrumb.innerHTML = `
        <span>Short Vowels</span>
        <span class="separator">›</span>
        <span>${vowel.name}</span>
        <span class="separator">›</span>
        <span>${currentView.sound}</span>
        <span class="separator">›</span>
        <span>${currentView.word}</span>
    `;

    content.innerHTML = `

        <div class="word-detail">

            <div class="detail-label">
                Core Word
            </div>

            <div class="detail-word">
                ${currentView.word}
            </div>

            <div class="detail-message">
                Now explore more words connected to
                <strong>${currentView.word}</strong>.
                Look closely at the letters and sounds you already know.
            </div>

        </div>


        <div class="section-heading">

            <h2>Vocabulary Expansion</h2>

            <p>
                Click any word to explore it.
            </p>

        </div>


        <div class="cards">

            ${expansions.map(word => `

                <button
                    class="card expansion-card"
                    onclick="selectExpansion('${word}')">

                    <div class="expansion-word">
                        ${word}
                    </div>

                    <div class="expansion-note">
                        Click to explore
                    </div>

                </button>

            `).join("")}

        </div>
    `;

}


/* =========================================================
   DETAIL VIEW
========================================================= */

function renderDetail() {

    const vowel = vocabulary[currentView.vowel];

    breadcrumb.innerHTML = `
        <span>Short Vowels</span>
        <span class="separator">›</span>
        <span>${vowel.name}</span>
        <span class="separator">›</span>
        <span>${currentView.sound}</span>
        <span class="separator">›</span>
        <span>${currentView.word}</span>
        <span class="separator">›</span>
        <span>${currentView.selectedExpansion}</span>
    `;

    content.innerHTML = `

        <div class="word-detail">

            <div class="detail-label">
                Vocabulary Word
            </div>

            <div class="detail-word">
                ${currentView.selectedExpansion}
            </div>

            <div class="detail-message">

                You started with
                <strong>${currentView.sound}</strong>,
                read the core word
                <strong>${currentView.word}</strong>,
                and discovered a longer word.

                <br><br>

                The more sound patterns and words you know,
                the more words you can read and write!

            </div>

        </div>


        <div class="end-message">

            <h3>Great Reading!</h3>

            <p>
                Choose another word, sound, or vowel to keep exploring.
            </p>

        </div>


        <div style="height:20px;"></div>


        <div class="cards">

            <button
                class="card"
                onclick="goBack()">

                <div class="card-word">
                    ← Back to Words
                </div>

            </button>

            <button
                class="card"
                onclick="resetApp()">

                <div class="card-word">
                    ↺ Start Again
                </div>

            </button>

        </div>
    `;

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    backButton.disabled = historyStack.length === 0;

    if (currentView.level === "root") {

        renderRoot();

    } else if (currentView.level === "sounds") {

        renderSounds();

    } else if (currentView.level === "words") {

        renderWords();

    } else if (currentView.level === "expansion") {

        renderExpansion();

    } else if (currentView.level === "detail") {

        renderDetail();

    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   START APP
========================================================= */

render();

</script>

</body>
</html>
