<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Short Vowels Vocabulary Explorer</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eaf6ff;
    color: #193b52;
}

.app {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 25px 18px 50px;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 54px);
    font-weight: 900;
    color: #1769aa;
    letter-spacing: 1px;
}

.header p {
    margin: 9px auto 0;
    max-width: 750px;
    font-size: 18px;
    line-height: 1.5;
    color: #587386;
}


/* =========================
   NAVIGATION
========================= */

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 18px 0;
    gap: 12px;
}

.nav-button {
    border: none;
    border-radius: 14px;
    padding: 13px 21px;
    min-height: 48px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s ease;
}

.back-button {
    background: white;
    color: #1769aa;
    border: 2px solid #b8dcf2;
}

.reset-button {
    background: #1769aa;
    color: white;
}

.nav-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(40,100,150,0.15);
}

.nav-button:active {
    transform: scale(0.97);
}

.nav-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}


/* =========================
   BREADCRUMB
========================= */

.breadcrumb {
    background: rgba(255,255,255,0.8);
    border: 1px solid #c6e4f5;
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 15px;
    color: #668293;
    min-height: 45px;
    line-height: 20px;
}

.breadcrumb span {
    color: #1769aa;
    font-weight: 700;
}

.breadcrumb .arrow {
    color: #9ab5c6;
    margin: 0 6px;
}


/* =========================
   INTRODUCTION
========================= */

.introduction {
    background: white;
    border-radius: 20px;
    padding: 20px 22px;
    margin-bottom: 24px;
    border-left: 6px solid #58afe5;
    box-shadow: 0 5px 18px rgba(60,120,160,0.08);
}

.introduction-title {
    font-size: 21px;
    font-weight: 800;
    color: #1769aa;
    margin-bottom: 7px;
}

.introduction-text {
    font-size: 16px;
    line-height: 1.55;
    color: #5e7585;
}


/* =========================
   SECTION
========================= */

.section {
    margin-bottom: 25px;
}

.section-title {
    text-align: center;
    margin: 18px 0 16px;
}

.section-title h2 {
    margin: 0;
    color: #214f70;
    font-size: clamp(25px, 5vw, 36px);
}

.section-title p {
    margin: 7px 0 0;
    color: #708797;
    font-size: 16px;
}


/* =========================
   CARDS
========================= */

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 15px;
}

.card {
    width: 100%;
    min-height: 105px;
    border: 2px solid transparent;
    border-radius: 20px;
    background: white;
    color: #193b52;
    padding: 18px;
    cursor: pointer;
    text-align: center;

    box-shadow:
        0 5px 15px rgba(60,120,160,0.10);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #83c8ee;

    box-shadow:
        0 9px 20px rgba(50,120,170,0.17);

    background: #fafdff;
}

.card:active {
    transform: scale(0.98);
}

.card:focus-visible {
    outline: 4px solid #9bd8f5;
    outline-offset: 3px;
}


/* =========================
   VOWEL CARDS
========================= */

.vowel-card {
    min-height: 150px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.vowel-letter {
    font-size: 58px;
    font-weight: 900;
    color: #1769aa;
    line-height: 1;
}

.vowel-name {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 800;
    color: #365d75;
}


/* =========================
   SOUND CARDS
========================= */

.sound-card {
    min-height: 125px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.sound-pattern {
    font-size: clamp(31px, 6vw, 43px);
    font-weight: 900;
    color: #1769aa;
}

.sound-example {
    margin-top: 8px;
    font-size: 15px;
    color: #718795;
}


/* =========================
   WORD CARDS
========================= */

.word-card {
    min-height: 120px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.word-main {
    font-size: clamp(27px, 5vw, 38px);
    font-weight: 900;
    color: #214f70;
}

.word-pattern {
    margin-top: 7px;
    font-size: 14px;
    font-weight: 700;
    color: #7a9bac;
}


/* =========================
   EXPANSION WORDS
========================= */

.expansion-card {
    min-height: 115px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.expansion-word {
    font-size: clamp(24px, 4.5vw, 34px);
    font-weight: 900;
    color: #214f70;
}

.expansion-note {
    margin-top: 7px;
    font-size: 14px;
    color: #78909f;
}


/* =========================
   EXPANDING LEVEL
========================= */

.expanding-section {
    margin-top: 22px;
    padding: 20px;

    background: rgba(255,255,255,0.65);

    border-radius: 22px;

    border-left: 5px solid #9bd5f2;

    animation: dropDown 0.3s ease;
}

@keyframes dropDown {

    from {
        opacity: 0;
        transform: translateY(-12px);
        max-height: 0;
    }

    to {
        opacity: 1;
        transform: translateY(0);
        max-height: 2000px;
    }

}


/* =========================
   LEVEL LABEL
========================= */

.level-label {
    text-align: center;
    margin-bottom: 15px;
}

.level-label h3 {
    margin: 0;
    font-size: 23px;
    color: #1769aa;
}

.level-label p {
    margin: 5px 0 0;
    font-size: 15px;
    color: #718796;
}


/* =========================
   SELECTED WORD DISPLAY
========================= */

.selected-word {
    background: white;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 17px;
    text-align: center;

    box-shadow: 0 4px 12px rgba(60,120,160,0.08);
}

.selected-word-label {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #7da2b5;
}

.selected-word-main {
    margin-top: 4px;
    font-size: 34px;
    font-weight: 900;
    color: #1769aa;
}


/* =========================
   HOME SECTION
========================= */

.home-section {
    margin-bottom: 25px;
}


/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    margin-top: 40px;
    color: #7894a5;
    font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .app {
        padding: 18px 12px 40px;
    }

    .navigation {
        position: sticky;
        top: 0;
        z-index: 20;

        padding: 10px 0;

        background: rgba(234,246,255,0.94);
        backdrop-filter: blur(6px);
    }

    .nav-button {
        flex: 1;
        font-size: 16px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .card {
        min-height: 105px;
    }

    .expanding-section {
        padding: 15px;
    }

    .introduction {
        padding: 17px;
    }

}

</style>
</head>


<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <h1>SHORT VOWELS</h1>

        <p>
            Start with a sound, read a word, and discover more vocabulary.
        </p>

    </div>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <div class="navigation">

        <button
            id="backButton"
            class="nav-button back-button"
            onclick="goBack()">

            ← Back

        </button>


        <button
            class="nav-button reset-button"
            onclick="resetApp()">

            ↺ Reset

        </button>

    </div>


    <!-- =========================
         BREADCRUMB
    ========================== -->

    <div
        id="breadcrumb"
        class="breadcrumb">

    </div>


    <!-- =========================
         APP CONTENT
    ========================== -->

    <div id="appContent"></div>


    <div class="footer">
        Short Vowels Vocabulary Explorer
    </div>

</div>

            },

            },

};


/* =========================================================
   STATE
========================================================= */

let selectedVowel = null;
let selectedSound = null;
let selectedWord = null;

let openLevel = 0;


/*
    0 = only vowels
    1 = vowel + sounds
    2 = vowel + sounds + words
    3 = vowel + sounds + words + expansions
*/


/* =========================================================
   ELEMENTS
========================================================= */

const appContent = document.getElementById("appContent");
const breadcrumb = document.getElementById("breadcrumb");
const backButton = document.getElementById("backButton");


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   SELECT VOWEL
========================================================= */

function selectVowel(vowel) {

    selectedVowel = vowel;

    selectedSound = null;
    selectedWord = null;

    openLevel = 1;

    render();

}


/* =========================================================
   SELECT SOUND
========================================================= */

function selectSound(sound) {

    selectedSound = sound;

    selectedWord = null;

    openLevel = 2;

    render();

}


/* =========================================================
   SELECT WORD
========================================================= */

function selectWord(word) {

    selectedWord = word;

    openLevel = 3;

    render();

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

    if (openLevel === 3) {

        selectedWord = null;
        openLevel = 2;

    }

    else if (openLevel === 2) {

        selectedSound = null;
        selectedWord = null;
        openLevel = 1;

    }

    else if (openLevel === 1) {

        selectedVowel = null;
        selectedSound = null;
        selectedWord = null;
        openLevel = 0;

    }

    render();

}


/* =========================================================
   RESET
========================================================= */

function resetApp() {

    selectedVowel = null;
    selectedSound = null;
    selectedWord = null;

    openLevel = 0;

    render();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   UPDATE BREADCRUMB
========================================================= */

function updateBreadcrumb() {

    let html = `<span>Short Vowels</span>`;

    if (selectedVowel) {

        html += `
            <span class="arrow">›</span>
            <span>${escapeHTML(vocabulary[selectedVowel].name)}</span>
        `;

    }

    if (selectedSound) {

        html += `
            <span class="arrow">›</span>
            <span>${escapeHTML(selectedSound)}</span>
        `;

    }

    if (selectedWord) {

        html += `
            <span class="arrow">›</span>
            <span>${escapeHTML(selectedWord)}</span>
        `;

    }

    breadcrumb.innerHTML = html;

}


/* =========================================================
   RENDER VOWELS
========================================================= */

function renderVowels() {

    return `

        <div class="home-section">

            <div class="introduction">

                <div class="introduction-title">
                    Let's build our vocabulary!
                </div>

                <div class="introduction-text">

                    Start with a short vowel sound.
                    Choose a sound pattern, read the core words,
                    and then explore more vocabulary.
                    <strong>
                        The more sound patterns you know,
                        the more words you can read and write.
                    </strong>

                </div>

            </div>


            <div class="section-title">

                <h2>Choose a Short Vowel</h2>

                <p>
                    Click a vowel to begin.
                </p>

            </div>


            <div class="cards">

                ${["A","E","I","O","U"].map(vowel => `

                    <button
                        class="card vowel-card"
                        onclick="selectVowel('${vowel}')">

                        <div class="vowel-letter">
                            ${vowel}
                        </div>

                        <div class="vowel-name">
                            ${vocabulary[vowel].name}
                        </div>

                    </button>

                `).join("")}

            </div>

        </div>

    `;

}


/* =========================================================
   RENDER SOUNDS
========================================================= */

function renderSounds() {

    const vowel = vocabulary[selectedVowel];

    const sounds = Object.keys(vowel.sounds);

    return `

        <div class="expanding-section">

            <div class="level-label">

                <h3>
                    ${escapeHTML(vowel.name)}
                </h3>

                <p>
                    Choose a sound pattern.
                </p>

            </div>


            <div class="cards">

                ${sounds.map(sound => {

                    const words =
                        Object.keys(vowel.sounds[sound].words);

                    const examples =
                        words.slice(0,3).join(", ");

                    return `

                        <button
                            class="card sound-card"
                            onclick="selectSound('${sound}')">

                            <div class="sound-pattern">
                                ${escapeHTML(sound)}
                            </div>

                            <div class="sound-example">
                                ${escapeHTML(examples)}...
                            </div>

                        </button>

                    `;

                }).join("")}

            </div>

        </div>

    `;

}


/* =========================================================
   RENDER WORDS
========================================================= */

function renderWords() {

    const vowel = vocabulary[selectedVowel];

    const soundData =
        vowel.sounds[selectedSound];

    const words =
        Object.keys(soundData.words);

    return `

        <div class="expanding-section">

            <div class="level-label">

                <h3>
                    Core Words for ${escapeHTML(selectedSound)}
                </h3>

                <p>
                    Click a word to discover more vocabulary.
                </p>

            </div>


            <div class="cards">

                ${words.map(word => `

                    <button
                        class="card word-card"
                        onclick="selectWord('${word}')">

                        <div class="word-main">
                            ${escapeHTML(word)}
                        </div>

                        <div class="word-pattern">
                            ${escapeHTML(selectedSound)}
                        </div>

                    </button>

                `).join("")}

            </div>

        </div>

    `;

}


/* =========================================================
   RENDER EXPANSION
========================================================= */

function renderExpansion() {

    const vowel = vocabulary[selectedVowel];

    const soundData =
        vowel.sounds[selectedSound];

    const expansionWords =
        soundData.words[selectedWord] || [];

    return `

        <div class="expanding-section">

            <div class="selected-word">

                <div class="selected-word-label">
                    Core Word
                </div>

                <div class="selected-word-main">
                    ${escapeHTML(selectedWord)}
                </div>

            </div>


            <div class="level-label">

                <h3>
                    Vocabulary Expansion
                </h3>

                <p>
                    What other words can you read?
                    Click a word to explore it.
                </p>

            </div>


            <div class="cards">

                ${expansionWords.map(word => `

                    <button
                        class="card expansion-card"
                        onclick="selectExpansion('${word}')">

                        <div class="expansion-word">
                            ${escapeHTML(word)}
                        </div>

                        <div class="expansion-note">
                            Click to explore
                        </div>

                    </button>

                `).join("")}

            </div>

        </div>

    `;

}


/* =========================================================
   SELECT EXPANSION
========================================================= */

function selectExpansion(word) {

    /*
        Instead of opening a new page,
        show the selected word underneath
        the existing vocabulary.
    */

    const existing =
        document.getElementById("selectedExpansion");

    if (existing) {
        existing.remove();
    }


    const expansionBox =
        document.createElement("div");

    expansionBox.id =
        "selectedExpansion";

    expansionBox.className =
        "expanding-section";


    expansionBox.innerHTML = `

        <div class="selected-word">

            <div class="selected-word-label">
                Word You Discovered
            </div>

            <div class="selected-word-main">
                ${escapeHTML(word)}
            </div>

        </div>


        <div class="level-label">

            <h3>
                Great Reading!
            </h3>

            <p>
                You started with
                <strong>${escapeHTML(selectedSound)}</strong>
                and explored
                <strong>${escapeHTML(selectedWord)}</strong>
                to discover
                <strong>${escapeHTML(word)}</strong>.
            </p>

        </div>

    `;


    const expansionSection =
        document.querySelector(".expanding-section:last-child");

    expansionSection.insertAdjacentElement(
        "afterend",
        expansionBox
    );


    setTimeout(() => {

        expansionBox.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 100);

}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function render() {

    updateBreadcrumb();

    backButton.disabled =
        openLevel === 0;


    /*
        Start with vowels.
    */

    let html = renderVowels();


    /*
        If a vowel has been selected,
        drop the sound section underneath.
    */

    if (openLevel >= 1 && selectedVowel) {

        html += renderSounds();

    }


    /*
        If a sound has been selected,
        drop the word section underneath.
    */

    if (openLevel >= 2 &&
        selectedVowel &&
        selectedSound) {

        html += renderWords();

    }


    /*
        If a core word has been selected,
        drop the expansion underneath.
    */

    if (openLevel >= 3 &&
        selectedVowel &&
        selectedSound &&
        selectedWord) {

        html += renderExpansion();

    }


    appContent.innerHTML = html;

}


/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
